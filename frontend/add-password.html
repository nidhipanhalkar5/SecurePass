<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Password - SecurePass</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="add-page">

        <header class="topbar">

            <div class="brand">
                🔐 SecurePass
            </div>

            <button
                class="lock-button"
                onclick="goDashboard()">
                ← Back to Vault
            </button>

        </header>


        <main class="add-container">

            <div class="add-card">

                <div class="add-title">

                    <div class="big-icon">
                        🔑
                    </div>

                    <h1>
                        Add New Password
                    </h1>

                    <p>
                        Save your account credentials securely.
                    </p>

                </div>


                <form id="passwordForm">

                    <div class="form-group">

                        <label>
                            Website / App
                        </label>

                        <input
                            type="text"
                            id="website"
                            placeholder="Example: Facebook"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Website URL
                        </label>

                        <input
                            type="url"
                            id="url"
                            placeholder="https://example.com"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Username / Email
                        </label>

                        <input
                            type="text"
                            id="username"
                            placeholder="demo@example.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Password
                        </label>

                        <div class="password-input">

                            <input
                                type="password"
                                id="accountPassword"
                                placeholder="Enter password"
                                required
                            >

                            <button
                                type="button"
                                onclick="toggleAccountPassword()">
                                👁
                            </button>

                        </div>

                    </div>


                    <div class="strength-container">

                        <div class="strength-bar">

                            <div id="strengthBar"></div>

                        </div>

                        <span id="strengthText">
                            Password strength
                        </span>

                    </div>


                    <button
                        type="button"
                        class="generate-button"
                        onclick="generatePassword()">
                        🎲 Generate Strong Password
                    </button>


                    <div class="form-group">

                        <label>
                            Notes
                        </label>

                        <textarea
                            id="notes"
                            placeholder="Optional notes..."
                            rows="4">
                        </textarea>

                    </div>


                    <div class="form-buttons">

                        <button
                            type="button"
                            class="cancel-button"
                            onclick="goDashboard()">
                            Cancel
                        </button>

                        <button
                            type="submit"
                            class="save-button">
                            🔒 Save Password
                        </button>

                    </div>


                    <p id="saveMessage"></p>

                </form>

            </div>

        </main>

    </div>


    <script>

    function goDashboard() {

        window.location.href =
            "dashboard.html";
    }


    function toggleAccountPassword() {

        const password =
            document.getElementById(
                "accountPassword"
            );

        if (password.type === "password") {

            password.type = "text";

        } else {

            password.type = "password";

        }
    }


    function generatePassword() {

        const characters =
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
            "abcdefghijklmnopqrstuvwxyz" +
            "0123456789" +
            "!@#$%^&*()_+";

        const randomValues =
            new Uint32Array(16);

        crypto.getRandomValues(
            randomValues
        );

        let password = "";


        for (let i = 0; i < 16; i++) {

            password +=
                characters[
                    randomValues[i] %
                    characters.length
                ];

        }


        document.getElementById(
            "accountPassword"
        ).value = password;


        checkStrength();
    }


    function checkStrength() {

        const password =
            document.getElementById(
                "accountPassword"
            ).value;

        const bar =
            document.getElementById(
                "strengthBar"
            );

        const text =
            document.getElementById(
                "strengthText"
            );


        let strength = 0;


        if (password.length >= 8) {
            strength++;
        }


        if (password.length >= 12) {
            strength++;
        }


        if (/[A-Z]/.test(password)) {
            strength++;
        }


        if (/[0-9]/.test(password)) {
            strength++;
        }


        if (/[^A-Za-z0-9]/.test(password)) {
            strength++;
        }


        if (strength <= 1) {

            bar.style.width = "20%";

            text.textContent =
                "Weak";

        } else if (strength <= 3) {

            bar.style.width = "60%";

            text.textContent =
                "Medium";

        } else {

            bar.style.width = "100%";

            text.textContent =
                "Strong";
        }
    }


    document
        .getElementById("accountPassword")
        .addEventListener(
            "input",
            checkStrength
        );


    document
        .getElementById("passwordForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const website =
                    document.getElementById(
                        "website"
                    ).value;


                const url =
                    document.getElementById(
                        "url"
                    ).value;


                const username =
                    document.getElementById(
                        "username"
                    ).value;


                const password =
                    document.getElementById(
                        "accountPassword"
                    ).value;


                const notes =
                    document.getElementById(
                        "notes"
                    ).value;


                let strength = 0;


                if (password.length >= 8) {
                    strength++;
                }


                if (password.length >= 12) {
                    strength++;
                }


                if (/[A-Z]/.test(password)) {
                    strength++;
                }


                if (/[0-9]/.test(password)) {
                    strength++;
                }


                if (/[^A-Za-z0-9]/.test(password)) {
                    strength++;
                }


                if (strength < 4) {

                    const message =
                        document.getElementById(
                            "saveMessage"
                        );

                    message.style.color =
                        "#f87171";

                    message.textContent =
                        "Password is too weak. Use at least 12 characters with uppercase letters, numbers and symbols.";

                    return;
                }


                const message =
                    document.getElementById(
                        "saveMessage"
                    );


                message.style.color =
                    "#fbbf24";

                message.textContent =
                    "Saving password...";


                try {

                    const response =
                        await fetch(
                            "https://securepass-n2et.onrender.com/api/passwords",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        website: website,
                                        url: url,
                                        username: username,
                                        password: password,
                                        notes: notes
                                    })
                            }
                        );


                    const result =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            result.message ||
                            "Failed to save password."
                        );
                    }


                    message.style.color =
                        "#4ade80";

                    message.textContent =
                        "Password saved successfully!";


                    setTimeout(
                        function() {

                            window.location.href =
                                "dashboard.html";

                        },
                        1000
                    );


                } catch (error) {

                    message.style.color =
                        "#f87171";

                    message.textContent =
                        "Backend connection failed. Make sure the C++ server is running.";

                    console.error(error);
                }

            }
        );

    </script>

</body>

</html>
