<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Password - SecurePass</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="add-page">

        <header class="topbar">

            <div class="brand">
                🔐 SecurePass
            </div>

            <button
                class="lock-button"
                onclick="goDashboard()">

                ← Back to Vault

            </button>

        </header>


        <main class="add-container">

            <div class="add-card">

                <div class="add-title">

                    <div class="big-icon">
                        ✏️
                    </div>

                    <h1>Edit Password</h1>

                    <p>
                        Update your saved account information.
                    </p>

                </div>


                <form id="editForm">


                    <div class="form-group">

                        <label>
                            Website / App
                        </label>

                        <input
                            type="text"
                            id="website"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Website URL
                        </label>

                        <input
                            type="url"
                            id="url"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Username / Email
                        </label>

                        <input
                            type="text"
                            id="username"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Password
                        </label>

                        <div class="password-input">

                            <input
                                type="password"
                                id="accountPassword"
                                required
                            >

                            <button
                                type="button"
                                onclick="togglePassword()">

                                👁

                            </button>

                        </div>

                    </div>


                    <div class="form-group">

                        <label>
                            Notes
                        </label>

                        <textarea
                            id="notes"
                            rows="4">
                        </textarea>

                    </div>


                    <div class="form-buttons">

                        <button
                            type="button"
                            class="cancel-button"
                            onclick="goDashboard()">

                            Cancel

                        </button>


                        <button
                            type="submit"
                            class="save-button">

                            💾 Update Password

                        </button>

                    </div>


                    <p id="editMessage"></p>


                </form>

            </div>

        </main>

    </div>


    <script>

        function goDashboard() {

            window.location.href =
                "dashboard.html";

        }


        function togglePassword() {

            const password =
                document.getElementById(
                    "accountPassword"
                );


            if (password.type === "password") {

                password.type = "text";

            } else {

                password.type = "password";

            }

        }


        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const id =
            Number(
                urlParams.get("id")
            );


        let passwords =
            JSON.parse(
                localStorage.getItem("passwords")
            ) || [];


        const item =
            passwords.find(function(password) {

                return password.id === id;

            });


        if (item) {

            document.getElementById("website").value =
                item.website;

            document.getElementById("url").value =
                item.url;

            document.getElementById("username").value =
                item.username;

            document.getElementById("accountPassword").value =
                item.password;

            document.getElementById("notes").value =
                item.notes;

        }


        document
            .getElementById("editForm")
            .addEventListener(
                "submit",
                function(event) {

                    event.preventDefault();


                    const updatedItem = {

                        id: id,

                        website:
                            document.getElementById(
                                "website"
                            ).value,

                        url:
                            document.getElementById(
                                "url"
                            ).value,

                        username:
                            document.getElementById(
                                "username"
                            ).value,

                        password:
                            document.getElementById(
                                "accountPassword"
                            ).value,

                        notes:
                            document.getElementById(
                                "notes"
                            ).value

                    };


                    passwords =
                        passwords.map(function(item) {

                            if (item.id === id) {

                                return updatedItem;

                            }

                            return item;

                        });


                    localStorage.setItem(
                        "passwords",
                        JSON.stringify(passwords)
                    );


                    const message =
                        document.getElementById(
                            "editMessage"
                        );


                    message.style.color =
                        "#4ade80";

                    message.textContent =
                        "Password updated successfully!";


                    setTimeout(function() {

                        window.location.href =
                            "dashboard.html";

                    }, 1000);

                }
            );

    </script>

</body>

</html>
